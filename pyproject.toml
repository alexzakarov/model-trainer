[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gotooltrain"
version = "0.1.0"
description = "Token format, validation and dataset builders for training a Go-specialised tool-use model on Qwen3.5-4B"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  # Verified, not assumed. `Qwen/Qwen3.5-4B` declares model type `qwen3_5`, which
  # transformers 4.x rejects outright -- the tokenizer loads but the config does
  # not, so nothing downstream of the tokenizer can run. 5.17 renders the shipped
  # template byte-identically to 4.57 (same sha, same token count, same assistant
  # mask), so the bump changes the runtime without changing the token format, and
  # the golden file stays valid. The ceiling is a major version, as before.
  "transformers>=5.17,<6",
  "tokenizers>=0.22",
  # vision.py opens images at runtime, so this is a library dependency rather than
  # a test-only one. It arrives transitively with transformers on some platforms
  # and not others, which makes its absence look like a broken environment.
  "pillow>=10.0",
]

[project.scripts]
gotooltrain-eval = "gotooltrain.evalcli:main"
gotooltrain-data = "gotooltrain.datacli:main"
gotooltrain-train = "gotooltrain.traincli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  # Pinned exactly, not with >=. The formatter's set of recognised files and its
  # layout rules both change between releases, so two developers on different
  # versions get different verdicts on the same tree -- and one of them is always
  # "would be reformatted" for reasons that have nothing to do with the code.
  "ruff==0.16.9",
  "mypy>=1.10",
  # The tokenizer and template tests render the shipped Jinja template directly.
  # It arrives transitively with transformers on some platforms but not all, and a
  # missing renderer is a confusing collection error rather than a clear one.
  "jinja2>=3.1",
  # Not a runtime requirement: a development-tool limitation. numpy 2.5's bundled
  # type stubs use the PEP 695 `type` statement, and mypy cannot parse them when
  # this project targets its 3.10 minimum. Nothing here type-annotates numpy, so
  # capping it keeps the strict gate reproducible rather than machine-dependent.
  "numpy<2.5",
]
# Needed to fine-tune, and needed by the tests that drive the real Qwen image
# processor: AutoProcessor resolves video-processor classes that import torch at
# module level, so merely loading the image processor fails without it.
train = [
  "torch>=2.4",
  "torchvision>=0.19",
  "accelerate>=1.0",
  # gocorpus.download_splits fetches the Go corpus through this. `datasets` was
  # declared here but nothing imports it: the corpus is plain JSON read with
  # json.load, so the extra was pulling hundreds of megabytes for no reason.
  "huggingface_hub>=0.36",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gotooltrain = ["templates/*.jinja"]
# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Coverage is driven by `coverage run -m pytest` (see Makefile), not by the
# pytest-cov plugin. pytest-cov 4.x enables coverage's parallel data files
# depending on the ambient environment, and a child process started in a pytest
# tmp directory cannot find this config, so it records statement-only data that
# then aborts the run with "Can't combine statement coverage data with branch
# data". The plugin path is not reproducible across environments.
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "slow: needs the Qwen3.5-4B tokenizer from the Hub (network)",
]
filterwarnings = ["ignore::UserWarning"]

[tool.coverage.run]
branch = true
source = ["gotooltrain"]
# regenerate_golden is a maintenance entry point, not library code
omit = ["*/regenerate_golden.py"]
data_file = ".coverage"
parallel = false

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# The notebook is generated by src/gotooltrain/build_notebook.py, which is linted,
# formatted and type-checked like any other module. Ruff also reads .ipynb files, and
# linting the generated copy would mean the Turkish prose in it is held to the
# identifier rules the generator's per-file ignore already exempts.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "B",         # bugbear
  "C4",        # comprehensions
  "UP",        # pyupgrade
  "SIM",       # simplify
  "RUF",       # ruff-specific
  "S",         # bandit
  "ANN",       # annotations
  "D",         # pydocstyle
  "PTH",       # pathlib
  "TID",       # tidy imports
]
ignore = [
  "D203",  # conflicts with D211
  "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
# Untrusted JSON, the dynamic transformers tokenizer API and the store's
# heterogeneous payloads are genuinely untyped; ANN401 elsewhere still applies.
"src/gotooltrain/normalize.py" = ["ANN401"]
"src/gotooltrain/schema.py" = ["ANN401"]
"src/gotooltrain/dataset.py" = ["ANN401"]
"src/gotooltrain/template.py" = ["ANN401"]
"src/gotooltrain/evalstore.py" = ["ANN401"]
# The sandbox is an argv-only wrapper around the `docker` CLI.
# S607: `docker` is resolved via PATH by design, so the harness honours a
#       version-managed install instead of a hardcoded absolute path.
# S108: /tmp is a *container* mount point, not a host path.
"src/gotooltrain/sandbox.py" = ["S607", "S108"]
"tests/*" = [
  "S101", "D103", "ANN201", "ANN001", "SLF001", "ANN202", "ANN002", "ANN003",
  "B905", "B007", "ANN401", "RUF001", "S108",
  # Tests shuffle example order to exercise the batching. Data ordering, not
  # anything security-bearing.
  "S311",
  # S607: the live-Docker tests shell out to `docker` exactly as the harness
  #       does, resolved through PATH on purpose.
  "S607",
  # S105/S106: a test for "a missing token must stop the run" has to *name* a
  #       token -- a mock fixture value, and the environment variable that holds
  #       it. Neither is a credential, and the check that matters (no literal
  #       secret is committed) is asserted directly in tests/test_hub.py.
  "S105",
  "S106",
]
# train.py seeds example order and picks a shuffling seed: data ordering, not
# anything security-bearing, so a seeded PRNG is the correct tool.
# ANN401: the training driver passes torch and transformers objects through
# unchanged; they have no single better annotation, and the `def` lines carry a
# coverage pragma that a second comment would displace.
"src/gotooltrain/train.py" = ["S311", "ANN401"]
# The preference loop annotates a transformers tokenizer as Any for the same
# reason train.py does: there is no single better type for it, and the field it
# needs (pad_token_id) is not part of the chat-template Protocol.
"src/gotooltrain/dpo.py" = ["ANN401"]
# The notebook generator carries Turkish prose, and Turkish `ı`/`İ` are exactly the
# homoglyph pair RUF001 exists to flag. In an identifier that is a real hazard; in a
# sentence addressed to a human it is the language. Scoped to this one file so the
# rule stays enforced everywhere an identifier is written.
"src/gotooltrain/build_notebook.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# Pinned rather than "auto": the formatter otherwise keeps whatever the first
# line of each file happens to use, so the same tree is "formatted" on Windows and
# "would be reformatted" under WSL. One fixed ending removes the platform split.
line-ending = "lf"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
files = ["src/gotooltrain"]
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true

[[tool.mypy.overrides]]
# follow_imports=skip keeps mypy from analysing third-party sources: their stub
# internals (jinja2 TypeGuard, torch's TypeGuard re-exports) crash mypy's own
# cache serializer with "Cannot serialize TypeGuardedType instance". Torch's stub
# re-exports through torch._C down to numpy, and numpy's bundled stubs use the
# PEP 695 `type` statement, which mypy cannot read when targeting this project's
# 3.10 minimum. Skip alone does not stop a `from x import *` re-export from being
# parsed, so numpy is additionally pinned below 2.5 in the dev extra: the upper
# bound is a typeshed/mypy limitation, not a property of this code.
# huggingface_hub is here for the same chain: it is postponed-tracked and imports
# numpy directly. gocorpus calls one function from the hub; its internals are not
# part of the API we type against.
module = [
  "jinja2.*",
  "transformers.*",
  "tokenizers.*",
  "torch",
  "torch.*",
  "huggingface_hub",
  "huggingface_hub.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Pillow's own stubs import numpy, and numpy's bundled stubs use the PEP 695
# `type` statement, which needs a 3.12+ parser. This project supports 3.10, so mypy
# is configured for 3.10 and cannot read them. Neither library is part of the API we
# type against -- PIL appears only behind a function-local import for opening
# images -- so skipping their internals keeps our own strict check strict instead of
# forcing the whole project up a Python version.
module = ["PIL.*", "numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true
